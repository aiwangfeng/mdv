[package]
name = "mdv"
version = "0.1.0"
edition = "2021"
description = "A TUI Markdown viewer with vim keybindings and inline image support"
authors = []

[[bin]]
name = "mdv"
path = "src/main.rs"

[dependencies]
# TUI framework
ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = { version = "0.28" }

# Markdown parsing
pulldown-cmark = { version = "0.12", default-features = false }

# Syntax highlighting
syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }

# Image rendering in terminal
ratatui-image = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
anyhow = "1"

# Configuration
serde = { version = "1", features = ["derive"] }
toml = "0.8"
directories = "5"

# String utilities
unicode-width = "0.2"

# Logging
log = "0.4"
env_logger = "0.11"
